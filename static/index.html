<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Project Manager (Pro)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    
    /* Smooth Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Utilities */
    input[type="file"]::file-selector-button { display: none; }
    .fade-in { animation: fadeIn 0.5s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* TOAST NOTIFICATIONS CSS */
    #toast-container {
        position: fixed; bottom: 24px; right: 24px; z-index: 100;
        display: flex; flex-direction: column; gap: 12px;
    }
    .toast {
        min-width: 300px; padding: 16px; border-radius: 12px;
        background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white; font-size: 0.95rem; font-weight: 500;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        display: flex; align-items: center; gap: 12px;
        animation: slideIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    .toast.success { border-left: 4px solid #10b981; }
    .toast.error   { border-left: 4px solid #ef4444; }
    .toast.info    { border-left: 4px solid #6366f1; }
    
    @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeOut { to { opacity: 0; transform: translateX(10px); } }
  </style>
</head>

<body class="bg-slate-900 min-h-screen text-slate-100 selection:bg-indigo-500 selection:text-white overflow-x-hidden">

  <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-600/20 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
  </div>

  <div id="toast-container"></div>

  <div class="w-full max-w-4xl mx-auto p-6 md:p-12">
    
    <div class="flex justify-between items-end mb-10 border-b border-slate-800 pb-6">
      <div>
        <h1 class="text-5xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-indigo-400">AI Manager</h1>
        <p class="text-slate-400 mt-2 font-light">Intelligent Task Orchestration</p>
      </div>
      <button onclick="generateRetrospective()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-indigo-400 px-5 py-2.5 rounded-xl text-sm font-bold transition shadow-lg hover:shadow-indigo-500/20 flex items-center gap-2 group">
        <span class="group-hover:rotate-12 transition-transform">📊</span> Coach Report
      </button>
    </div>

    <div class="bg-slate-800/40 backdrop-blur-xl border border-slate-700/50 p-6 rounded-3xl shadow-2xl mb-12 relative group-focus-within:ring-2 group-focus-within:ring-indigo-500/50 transition-all">
      <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 opacity-70"></div>
      
      <div class="relative z-10">
         <textarea id="taskInput" rows="2" placeholder="✨ Describe a task (e.g. 'Finish report tomorrow at 5pm')..." 
          class="w-full bg-slate-900/60 text-slate-100 p-5 rounded-2xl border border-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 focus:outline-none transition resize-none placeholder-slate-500 text-lg shadow-inner"
          oninput="handleInput(this.value)"></textarea>
         
         <div id="suggestionsBoxContainer" class="absolute left-0 right-0 top-full mt-2 z-50">
             <div id="suggestionsBox" class="hidden bg-slate-800 border border-slate-600 rounded-xl shadow-2xl p-1 overflow-hidden"></div>
         </div>
      </div>

      <div class="flex flex-col md:flex-row gap-4 mt-5">
          <label class="flex-1 cursor-pointer bg-slate-900/30 border-2 border-slate-700 border-dashed rounded-xl hover:bg-slate-800 hover:border-indigo-500 transition flex items-center justify-center p-4 text-sm text-slate-400 gap-3 group-file relative overflow-hidden">
              <div class="absolute inset-0 bg-indigo-500/5 opacity-0 group-file-hover:opacity-100 transition"></div>
              <svg class="w-6 h-6 text-slate-500 group-file-hover:text-indigo-400 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              <span id="fileNameDisplay" class="font-medium relative z-10">Drop image for AI analysis...</span>
              <input type="file" id="imageInput" accept="image/jpeg, image/png" class="hidden" onchange="handleFileSelect(this)">
          </label>

          <button onclick="addTask()" id="addTaskBtn" class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white px-10 py-4 rounded-xl font-bold shadow-lg shadow-indigo-600/20 transition transform hover:-translate-y-0.5 active:translate-y-0 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 min-w-[160px]">
             <span>Analyze & Add</span>
             <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
          </button>
      </div>
    </div>

    <div class="space-y-10">
       
       <div class="fade-in">
         <div class="flex items-center gap-3 mb-6">
            <h2 class="text-2xl font-bold text-slate-200">Active Tasks</h2>
            <span id="pendingCount" class="text-xs font-bold bg-indigo-900/50 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded-full">0</span>
         </div>
         
         <ul id="taskList" class="grid grid-cols-1 gap-4">
            </ul>
       </div>

       <div class="fade-in">
         <div class="flex items-center gap-3 mb-6 mt-12 border-t border-slate-800 pt-8">
            <h2 class="text-xl font-bold text-slate-500">History</h2>
            <span id="completedCount" class="text-xs font-bold bg-slate-800 text-slate-500 px-2.5 py-1 rounded-full">0</span>
         </div>
         <ul id="completedList" class="space-y-3 opacity-70 hover:opacity-100 transition duration-500">
            </ul>
       </div>
    </div>
  </div>

  <div id="editModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm">
    <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl shadow-2xl w-full max-w-md">
      <h2 class="text-2xl font-bold mb-6 text-white">Edit Task</h2>
      <input type="hidden" id="editTaskIndex">
      <div class="space-y-4">
          <input type="text" id="editText" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-600 text-white focus:ring-indigo-500 outline-none">
          <input type="date" id="editDate" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-600 text-white [color-scheme:dark]">
          <select id="editEffort" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-600 text-white">
            <option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option><option value="Critical">Critical</option>
          </select>
      </div>
      <div class="flex justify-end space-x-3 mt-8">
        <button onclick="closeEditModal()" class="px-5 py-2 text-slate-300">Cancel</button>
        <button onclick="saveEdit()" class="px-6 py-2 text-white bg-indigo-600 rounded-lg">Save</button>
      </div>
    </div>
  </div>

  <div id="coachModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-md">
    <div class="bg-slate-800 rounded-3xl shadow-2xl w-full max-w-xl border border-slate-700 flex flex-col max-h-[85vh]">
      <div class="bg-slate-900/50 p-6 border-b border-slate-700 flex justify-between">
        <h2 class="text-2xl font-bold">Weekly Review</h2>
        <span id="coachScore" class="text-3xl font-black text-emerald-400">--</span>
      </div>
      <div class="p-8 overflow-y-auto space-y-6">
        <p id="coachSummary" class="text-slate-200 italic">Analyzing...</p>
        <ul id="coachPatterns" class="space-y-2"></ul>
        <ul id="coachAdvice" class="space-y-2"></ul>
      </div>
      <div class="p-5 border-t border-slate-700 flex justify-end">
        <button onclick="closeCoachModal()" class="px-6 py-2 bg-slate-700 rounded-xl">Close</button>
      </div>
    </div>
  </div>

  <script>
    // --- CONFIGURATION ---
    // Ensure this points to your running Flask Backend
    const API_BASE_URL = 'http://127.0.0.1:5000'; 
    const API_ANALYZE_ENDPOINT = API_BASE_URL + '/api/analyze';
    const API_SUGGEST_ENDPOINT = API_BASE_URL + '/api/suggest';
    const API_CAPTURE_ENDPOINT = API_BASE_URL + '/api/capture';
    const API_RETRO_ENDPOINT = API_BASE_URL + '/api/retrospective';

    // --- STATE ---
    let tasks = [];
    let completed = [];
    let suggestionTimeout = null;
    let base64ImageString = null;

    // --- INIT ---
    document.addEventListener('DOMContentLoaded', () => {
        loadTasks();
        showList();
        requestNotificationPermission();
    });

    // --- TOAST NOTIFICATIONS (Replaces Alerts) ---
    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        
        let icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
        toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
        container.appendChild(toast);
        
        setTimeout(() => {
            toast.style.animation = 'fadeOut 0.5s forwards';
            setTimeout(() => toast.remove(), 500);
        }, 3500);
    }

    // --- CORE TASK LOGIC ---
    
    async function addTask() {
        let input = document.getElementById("taskInput").value.trim();
        if (!input) return showToast("Please enter a task description!", "error");

        const btn = document.getElementById('addTaskBtn');
        const originalText = btn.innerHTML;
        
        // 1. Set Loading State
        btn.innerHTML = `<span>Analyzing...</span>`;
        btn.disabled = true;

        try {
            let analyzed = null;
            
            try {
                // Try Backend AI
                const response = await fetch(API_ANALYZE_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task_text: input })
                });
                if (!response.ok) throw new Error("Backend Offline");
                analyzed = await response.json();
                showToast("AI analyzed your task!", "success");
            } catch (err) {
                // Fallback to Local
                console.warn("Using fallback logic", err);
                analyzed = analyzeTaskFallback(input);
                showToast("Offline mode: Task added locally.", "info");
            }

            if (analyzed) {
                analyzed.status = "Pending";
                tasks.push(analyzed);
                saveTasks();
                showList();
                document.getElementById("taskInput").value = ""; // Clear input
            }

        } catch (e) {
            console.error(e);
            showToast("Critical Error. Check Console.", "error");
        } finally {
            // 2. ALWAYS RESET BUTTON
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }

    function showList() {
        const list = document.getElementById("taskList");
        const completedList = document.getElementById("completedList");
        list.innerHTML = "";
        completedList.innerHTML = "";

        // Update Counts
        document.getElementById("pendingCount").innerText = tasks.length;
        document.getElementById("completedCount").innerText = completed.length;

        // EMPTY STATE
        if (tasks.length === 0) {
            list.innerHTML = `
                <div class="text-center py-12 opacity-40 flex flex-col items-center">
                    <div class="text-6xl mb-4 grayscale">🏖️</div>
                    <h3 class="text-xl font-bold text-slate-300">All caught up!</h3>
                    <p class="text-slate-500">No active tasks. Time to relax or add a new one.</p>
                </div>
            `;
        }

        const getPriorityColor = (score) => {
            if(score === 'Critical') return 'bg-red-500 shadow-[0_0_15px_rgba(239,68,68,0.5)]';
            if(score === 'High') return 'bg-orange-500';
            if(score === 'Medium') return 'bg-indigo-500';
            return 'bg-emerald-500';
        };

        const today = new Date().toISOString().split('T')[0];

        // RENDER PENDING
        tasks.sort((a, b) => b.urgent - a.urgent);
        tasks.forEach((task, index) => {
            const isOverdue = (task.time < today && task.time !== 'unspecified' && task.time.match(/^\d{4}-\d{2}-\d{2}/));
            const urgencyBar = getPriorityColor(task.effort_score);
            
            const li = document.createElement("li");
            li.className = "group relative bg-slate-800/60 backdrop-blur-md border border-slate-700 p-5 rounded-2xl hover:bg-slate-800 hover:border-indigo-500/50 transition-all duration-300 hover:shadow-xl hover:-translate-y-1";
            li.innerHTML = `
              <div class="absolute left-0 top-4 bottom-4 w-1.5 rounded-r-full ${urgencyBar}"></div>
              <div class="flex justify-between items-start pl-4">
                <div class="flex-1 cursor-pointer" onclick="openEditModal(${index})">
                   <div class="flex items-center gap-3 mb-2">
                       <h3 class="text-lg font-bold text-slate-100 group-hover:text-indigo-300 transition-colors">${task.text}</h3>
                       ${isOverdue ? '<span class="text-[10px] bg-red-500/10 text-red-400 border border-red-500/20 px-2 rounded uppercase font-bold">Overdue</span>' : ''}
                       ${task.urgent ? '<span class="text-[10px] bg-orange-500/10 text-orange-400 border border-orange-500/20 px-2 rounded uppercase font-bold">Urgent</span>' : ''}
                   </div>
                   <div class="flex flex-wrap items-center gap-3 text-xs font-medium text-slate-400">
                      <span class="bg-slate-900/50 px-2 py-1 rounded border border-slate-700">📅 ${task.time}</span>
                      <span class="bg-slate-900/50 px-2 py-1 rounded border border-slate-700">🏷 ${task.category}</span>
                   </div>
                </div>
                <div class="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button onclick="completeTask(${index})" class="p-2 bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500 hover:text-white rounded-lg transition">✔</button>
                    <button onclick="deleteTask(${index})" class="p-2 bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white rounded-lg transition">🗑</button>
                </div>
              </div>
            `;
            list.appendChild(li);
        });

        // RENDER COMPLETED
        completed.forEach((task) => {
            const li = document.createElement("li");
            li.className = "flex justify-between items-center p-4 rounded-xl border border-slate-800 bg-slate-900/40";
            li.innerHTML = `<span class="line-through text-slate-500">${task.text}</span><span class="text-emerald-500 text-xs font-bold">DONE</span>`;
            completedList.appendChild(li);
        });
        
        document.getElementById("suggestionsBoxContainer").classList.add("hidden");
    }

    function completeTask(index) {
        // CONFETTI EFFECT
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#6366f1', '#a855f7'] });
        
        tasks[index].status = "Done";
        completed.push(tasks[index]);
        tasks.splice(index, 1);
        saveTasks();
        showList();
        showToast("Great job! Task completed. 🎉", "success");
    }

    // --- OTHER HELPERS ---

    function handleFileSelect(input) {
        const file = input.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) return showToast("Please upload an image (JPG/PNG).", "error");
        
        document.getElementById('fileNameDisplay').innerText = `📸 ${file.name}`;
        
        const reader = new FileReader();
        reader.onloadend = () => {
            base64ImageString = reader.result;
            // Auto-Analyze
            analyzeImage(); 
        };
        reader.readAsDataURL(file);
    }

    async function analyzeImage() {
        if (!base64ImageString) return;
        const btn = document.getElementById('addTaskBtn');
        btn.innerHTML = `<span>Scanning...</span>`; btn.disabled = true;

        try {
            const response = await fetch(API_CAPTURE_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image_data: base64ImageString, text_prompt: "Extract tasks" })
            });
            const data = await response.json();
            
            if (data.extracted_tasks && data.extracted_tasks.length > 0) {
                data.extracted_tasks.forEach(t => tasks.push(t));
                saveTasks(); showList();
                showToast(`Extracted ${data.extracted_tasks.length} tasks!`, "success");
            } else {
                showToast("No tasks found in image.", "info");
            }
        } catch (e) {
            showToast("Image analysis failed.", "error");
        } finally {
            btn.innerHTML = `<span>Analyze & Add</span>`; btn.disabled = false;
            base64ImageString = null; document.getElementById('imageInput').value = '';
            document.getElementById('fileNameDisplay').innerText = "Drop image for AI analysis...";
        }
    }

    function analyzeTaskFallback(text) {
        let task = { text, time: "unspecified", category: "General", urgent: false, note: "Local fallback", effort_score: "Low", status: "Pending" };
        if (text.match(/urgent|asap/i)) { task.urgent = true; task.effort_score = "High"; }
        return task;
    }

    function handleInput(val) {
        clearTimeout(suggestionTimeout);
        if(val.length > 3) suggestionTimeout = setTimeout(() => fetchAISuggestions(val), 600);
        else document.getElementById("suggestionsBoxContainer").classList.add("hidden");
    }

    async function fetchAISuggestions(text) {
        const box = document.getElementById("suggestionsBox");
        document.getElementById("suggestionsBoxContainer").classList.remove("hidden");
        box.classList.remove("hidden");
        try {
            const res = await fetch(API_SUGGEST_ENDPOINT, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ partial_task: text }) });
            const data = await res.json();
            box.innerHTML = "";
            (data.suggestions || []).forEach(s => {
                const div = document.createElement("div");
                div.className = "p-3 hover:bg-slate-700 cursor-pointer text-sm text-slate-300";
                div.textContent = s;
                div.onclick = () => { document.getElementById("taskInput").value = s; document.getElementById("suggestionsBoxContainer").classList.add("hidden"); };
                box.appendChild(div);
            });
        } catch(e) { document.getElementById("suggestionsBoxContainer").classList.add("hidden"); }
    }

    // Modal & Storage Logic (Standard)
    function loadTasks() { 
        const t = localStorage.getItem('ai_tasks'); const c = localStorage.getItem('ai_completed');
        if(t) tasks = JSON.parse(t); if(c) completed = JSON.parse(c);
    }
    function saveTasks() { localStorage.setItem('ai_tasks', JSON.stringify(tasks)); localStorage.setItem('ai_completed', JSON.stringify(completed)); }
    function deleteTask(index) { if(confirm("Delete?")) { tasks.splice(index, 1); saveTasks(); showList(); showToast("Task deleted", "info"); } }
    function openEditModal(i) { document.getElementById('editModal').classList.remove('hidden'); document.getElementById('editTaskIndex').value = i; document.getElementById('editText').value = tasks[i].text; }
    function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }
    function closeCoachModal() { document.getElementById('coachModal').classList.add('hidden'); }
    function saveEdit() { 
        const i = document.getElementById('editTaskIndex').value; 
        tasks[i].text = document.getElementById('editText').value; 
        tasks[i].effort_score = document.getElementById('editEffort').value;
        tasks[i].urgent = (tasks[i].effort_score === 'Critical' || tasks[i].effort_score === 'High');
        saveTasks(); showList(); closeEditModal(); showToast("Changes saved", "success");
    }
    async function generateRetrospective() {
        document.getElementById('coachModal').classList.remove('hidden');
        try {
             const res = await fetch(API_RETRO_ENDPOINT, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ completed: completed, pending: tasks }) });
             const data = await res.json();
             document.getElementById('coachSummary').innerText = data.summary;
             document.getElementById('coachScore').innerText = data.productivity_score;
             document.getElementById('coachPatterns').innerHTML = data.patterns.map(p=>`<li>${p}</li>`).join('');
             document.getElementById('coachAdvice').innerHTML = data.advice.map(a=>`<li>${a}</li>`).join('');
        } catch(e) { document.getElementById('coachSummary').innerText = "Coach Offline"; }
    }
    function requestNotificationPermission() { if("Notification" in window) Notification.requestPermission(); }
  </script>
</body>
</html>
