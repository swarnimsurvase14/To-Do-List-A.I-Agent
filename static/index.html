<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Project Manager (Pro)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    
    /* Custom Scrollbar for Glass Aesthetic */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Hide default file input button */
    input[type="file"]::file-selector-button { display: none; }
    
    /* Smooth fade in for lists */
    .fade-in { animation: fadeIn 0.5s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>

<body class="bg-slate-900 min-h-screen text-slate-100 selection:bg-indigo-500 selection:text-white overflow-x-hidden">

  <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-600/20 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
    <div class="absolute top-[40%] left-[40%] w-72 h-72 bg-emerald-600/10 rounded-full blur-3xl mix-blend-screen"></div>
  </div>

  <div class="w-full max-w-4xl mx-auto p-6 md:p-12">
    
    <div class="flex justify-between items-end mb-10 border-b border-slate-800 pb-6">
      <div>
        <h1 class="text-5xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-indigo-400">AI Project Manager</h1>
        <p class="text-slate-400 mt-2 font-light">Intelligent Task Orchestration & Analysis</p>
      </div>
      <button onclick="generateRetrospective()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-indigo-400 px-5 py-2.5 rounded-xl text-sm font-bold transition shadow-lg hover:shadow-indigo-500/20 flex items-center gap-2 group">
        <span class="group-hover:rotate-12 transition-transform">📊</span> Weekly Coach Report
      </button>
    </div>

    <div class="bg-slate-800/40 backdrop-blur-xl border border-slate-700/50 p-6 rounded-3xl shadow-2xl mb-12 relative overflow-visible group-focus-within:ring-2 group-focus-within:ring-indigo-500/50 transition-all">
      
      <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 opacity-70"></div>
      
      <div class="relative z-10">
         <textarea id="taskInput" rows="2" placeholder="✨ Describe a task (e.g. 'Finish report tomorrow at 5pm') or paste an image below..." 
          class="w-full bg-slate-900/60 text-slate-100 p-5 rounded-2xl border border-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 focus:outline-none transition resize-none placeholder-slate-500 text-lg shadow-inner"
          oninput="handleInput(this.value)"></textarea>
         
         <div id="suggestionsBoxContainer" class="absolute left-0 right-0 top-full mt-2 z-50">
             <div id="suggestionsBox" class="hidden bg-slate-800 border border-slate-600 rounded-xl shadow-2xl p-1 overflow-hidden"></div>
         </div>
      </div>

      <div class="flex flex-col md:flex-row gap-4 mt-5">
          <label class="flex-1 cursor-pointer bg-slate-900/30 border-2 border-slate-700 border-dashed rounded-xl hover:bg-slate-800 hover:border-indigo-500 transition flex items-center justify-center p-4 text-sm text-slate-400 gap-3 group-file relative overflow-hidden">
              <div class="absolute inset-0 bg-indigo-500/5 opacity-0 group-file-hover:opacity-100 transition"></div>
              <svg class="w-6 h-6 text-slate-500 group-file-hover:text-indigo-400 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              <span id="fileNameDisplay" class="font-medium relative z-10">Drop image for AI analysis...</span>
              <input type="file" id="imageInput" accept="image/jpeg, image/png" class="hidden" onchange="handleFileSelect(this)">
          </label>

          <button onclick="addTask()" id="addTaskBtn" class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white px-10 py-4 rounded-xl font-bold shadow-lg shadow-indigo-600/20 transition transform hover:-translate-y-0.5 active:translate-y-0 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 min-w-[160px]">
             <span>Analyze & Add</span>
             <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
          </button>
      </div>
    </div>

    <div class="space-y-10">
       
       <div class="fade-in">
         <div class="flex items-center gap-3 mb-6">
            <h2 class="text-2xl font-bold text-slate-200">Active Tasks</h2>
            <span id="pendingCount" class="text-xs font-bold bg-indigo-900/50 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded-full">0</span>
         </div>
         
         <ul id="taskList" class="grid grid-cols-1 gap-4">
            </ul>
       </div>

       <div class="fade-in">
         <div class="flex items-center gap-3 mb-6 mt-12 border-t border-slate-800 pt-8">
            <h2 class="text-xl font-bold text-slate-500">Completed History</h2>
            <span id="completedCount" class="text-xs font-bold bg-slate-800 text-slate-500 px-2.5 py-1 rounded-full">0</span>
         </div>
         <ul id="completedList" class="space-y-3 opacity-70 hover:opacity-100 transition duration-500">
            </ul>
       </div>
    </div>

  </div> <div id="editModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm">
    <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl shadow-2xl w-full max-w-md transform transition-all scale-100">
      <h2 class="text-2xl font-bold mb-6 text-white">Edit Task</h2>
      <input type="hidden" id="editTaskIndex">
      <div class="space-y-5">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Description</label>
          <input type="text" id="editText" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-600 text-white focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Due Date</label>
              <input type="date" id="editDate" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-600 text-white focus:ring-2 focus:ring-indigo-500 outline-none [color-scheme:dark]">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Effort Level</label>
              <select id="editEffort" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-600 text-white focus:ring-2 focus:ring-indigo-500 outline-none">
                <option value="Critical">Critical</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
                <option value="Unspecified">Unspecified</option>
              </select>
            </div>
        </div>
      </div>
      <div class="flex justify-end space-x-3 mt-8">
        <button onclick="closeEditModal()" class="px-5 py-2 text-sm font-semibold text-slate-300 hover:text-white transition">Cancel</button>
        <button onclick="saveEdit()" class="px-6 py-2 text-sm font-bold text-white bg-indigo-600 rounded-lg hover:bg-indigo-500 shadow-lg shadow-indigo-600/30 transition">Save Changes</button>
      </div>
    </div>
  </div>

  <div id="coachModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-md">
    <div class="bg-slate-800 rounded-3xl shadow-2xl w-full max-w-xl border border-slate-700 flex flex-col max-h-[85vh] overflow-hidden">
      <div class="bg-slate-900/50 p-8 border-b border-slate-700 flex justify-between items-center">
        <div>
           <h2 class="text-3xl font-extrabold text-white tracking-tight">Weekly Review</h2>
           <p class="text-indigo-400 text-sm font-medium mt-1">AI Productivity Coach</p>
        </div>
        <div class="text-center bg-slate-800 p-3 rounded-xl border border-slate-700">
            <span id="coachScore" class="text-4xl font-black text-emerald-400 block leading-none">--</span>
            <span class="text-[10px] uppercase tracking-wider text-slate-400 font-bold mt-1">Score</span>
        </div>
      </div>
      <div class="p-8 overflow-y-auto space-y-8 custom-scrollbar">
        <div class="bg-indigo-900/20 border border-indigo-500/20 p-5 rounded-xl">
            <h3 class="text-xs font-bold text-indigo-300 uppercase mb-2 tracking-widest">Executive Summary</h3>
            <p id="coachSummary" class="text-slate-200 italic leading-relaxed text-lg">Analyzing your week...</p>
        </div>
        <div>
            <h3 class="text-xs font-bold text-slate-400 uppercase mb-3 tracking-widest">Observed Patterns</h3>
            <ul id="coachPatterns" class="space-y-3"></ul>
        </div>
        <div>
            <h3 class="text-xs font-bold text-emerald-400 uppercase mb-3 tracking-widest">💡 Strategic Advice</h3>
            <ul id="coachAdvice" class="space-y-3"></ul>
        </div>
      </div>
      <div class="p-5 border-t border-slate-700 flex justify-end bg-slate-900/30">
        <button onclick="closeCoachModal()" class="px-8 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold transition">Close Report</button>
      </div>
    </div>
  </div>

  <script>
    let tasks = [];
    let completed = [];
    let suggestionTimeout = null;
    let base64ImageString = null;
    
    // API CONFIG
    const API_BASE_URL = ''; 
    const API_ANALYZE_ENDPOINT = '/api/analyze';
    const API_SUGGEST_ENDPOINT = '/api/suggest';
    const API_CAPTURE_ENDPOINT = '/api/capture';
    const API_RETRO_ENDPOINT = '/api/retrospective';

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
        loadTasks();
        showList(); // Render immediately
        requestNotificationPermission();
    });

    // --- FILE HANDLING ---
    function handleFileSelect(input) {
        const file = input.files[0];
        if (file) {
            document.getElementById('fileNameDisplay').innerText = `📸 ${file.name}`;
            document.getElementById('fileNameDisplay').classList.add('text-indigo-300');
            
            if (file.size > 7 * 1024 * 1024) return alert("File too large. Max 7MB.");
            
            const reader = new FileReader();
            reader.onloadend = () => {
                base64ImageString = reader.result;
                // Auto trigger analysis or wait for user to click button?
                // Let's analyze immediately for better UX
                analyzeImage(); 
            };
            reader.readAsDataURL(file);
        }
    }

    // --- CORE RENDERING ENGINE (The "Cards") ---
    function showList() {
        const list = document.getElementById("taskList");
        const completedList = document.getElementById("completedList");
        
        list.innerHTML = "";
        completedList.innerHTML = "";

        // Update Counts
        document.getElementById("pendingCount").innerText = tasks.length;
        document.getElementById("completedCount").innerText = completed.length;

        const getPriorityColor = (score) => {
            if(score === 'Critical') return 'bg-red-500 shadow-[0_0_15px_rgba(239,68,68,0.5)]';
            if(score === 'High') return 'bg-orange-500';
            if(score === 'Medium') return 'bg-indigo-500';
            return 'bg-emerald-500';
        };

        const today = new Date().toISOString().split('T')[0];

        // 1. PENDING TASKS
        tasks.sort((a, b) => b.urgent - a.urgent);
        
        tasks.forEach((task, index) => {
            const isOverdue = (task.time < today && task.time !== 'unspecified' && task.time.match(/^\d{4}-\d{2}-\d{2}/));
            const urgencyBar = getPriorityColor(task.effort_score);
            
            const li = document.createElement("li");
            // Card Styles
            li.className = "group relative bg-slate-800/60 backdrop-blur-md border border-slate-700 p-5 rounded-2xl hover:bg-slate-800 hover:border-indigo-500/50 transition-all duration-300 hover:shadow-xl hover:shadow-indigo-500/5 hover:-translate-y-1";
            
            li.innerHTML = `
              <div class="absolute left-0 top-4 bottom-4 w-1.5 rounded-r-full ${urgencyBar}"></div>

              <div class="flex justify-between items-start pl-4">
                <div class="flex-1 cursor-pointer" onclick="openEditModal(${index})">
                   <div class="flex items-center gap-3 mb-2">
                       <h3 class="text-lg font-bold text-slate-100 group-hover:text-indigo-300 transition-colors">${task.text}</h3>
                       ${isOverdue ? '<span class="text-[10px] font-extrabold bg-red-500/10 text-red-400 border border-red-500/20 px-2 py-0.5 rounded uppercase tracking-wider">Overdue</span>' : ''}
                       ${task.urgent ? '<span class="text-[10px] font-extrabold bg-orange-500/10 text-orange-400 border border-orange-500/20 px-2 py-0.5 rounded uppercase tracking-wider">Urgent</span>' : ''}
                   </div>
                   
                   <div class="flex flex-wrap items-center gap-3 text-xs font-medium text-slate-400">
                      <span class="flex items-center gap-1.5 bg-slate-900/50 px-2.5 py-1.5 rounded-lg border border-slate-700/50">
                        <span>📅</span> ${task.time}
                      </span>
                      <span class="flex items-center gap-1.5 bg-slate-900/50 px-2.5 py-1.5 rounded-lg border border-slate-700/50">
                        <span>🏷</span> ${task.category}
                      </span>
                      ${task.note ? `<span class="text-slate-500 italic truncate max-w-[200px] border-l border-slate-700 pl-3">${task.note}</span>` : ''}
                   </div>
                </div>
                
                <div class="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
                    <button onclick="completeTask(${index})" class="p-2.5 rounded-xl bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500 hover:text-white border border-emerald-500/20 transition" title="Complete">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    </button>
                    <button onclick="deleteTask(${index})" class="p-2.5 rounded-xl bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white border border-red-500/20 transition" title="Delete">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
              </div>
            `;
            list.appendChild(li);
        });

        // 2. COMPLETED TASKS
        completed.forEach((task) => {
            const li = document.createElement("li");
            li.className = "flex justify-between items-center p-4 rounded-xl border border-slate-800 bg-slate-900/40";
            li.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="w-5 h-5 rounded-full bg-emerald-900/50 border border-emerald-500/50 flex items-center justify-center">
                        <svg class="w-3 h-3 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <div>
                        <span class="line-through text-slate-500 decoration-2 decoration-slate-600 block">${task.text}</span>
                        <span class="text-[10px] text-slate-600 uppercase font-bold tracking-wider">${task.category}</span>
                    </div>
                </div>
            `;
            completedList.appendChild(li);
        });
        
        // Hide suggestions if open
        document.getElementById("suggestionsBoxContainer").classList.add("hidden");
    }

    // --- API FUNCTIONS ---

    async function addTask() {
      let input = document.getElementById("taskInput").value.trim();
      if (!input) return alert("Please enter a task!");

      const btn = document.getElementById('addTaskBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = `<span>Analyzing...</span>`;
      btn.disabled = true;

      let analyzed = null;

      try {
          const response = await fetch(API_ANALYZE_ENDPOINT, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ task_text: input })
          });
          if (!response.ok) throw new Error("API Error");
          analyzed = await response.json();
      } catch (error) {
          console.warn("Fallback to local", error);
          analyzed = analyzeTaskFallback(input);
      } 
      
      if (analyzed) {
          analyzed.status = "Pending";
          tasks.push(analyzed);
          saveTasks();
          showList();
          scheduleReminder(analyzed);
      }

      document.getElementById("taskInput").value = "";
      btn.innerHTML = originalText;
      btn.disabled = false;
    }

    async function analyzeImage() {
        if (!base64ImageString) return; // Should be handled by UI check usually
        
        const btn = document.getElementById('addTaskBtn');
        btn.innerHTML = `<span>Scanning Image...</span>`;
        btn.disabled = true;

        try {
            const response = await fetch(API_CAPTURE_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    image_data: base64ImageString,
                    text_prompt: "Extract all tasks, deadlines, and categories." 
                })
            });

            if (!response.ok) throw new Error("Image API Failed");
            const data = await response.json();
            
            if (data.extracted_tasks && data.extracted_tasks.length > 0) {
                data.extracted_tasks.forEach(task => {
                    tasks.push(task);
                    scheduleReminder(task);
                });
                saveTasks();
                showList();
                alert(`✨ Extracted ${data.extracted_tasks.length} tasks!`);
            } else {
                alert("No tasks found in image.");
            }

        } catch (error) {
            console.error(error);
            alert("Image analysis failed.");
        } finally {
            btn.innerHTML = `<span>Analyze & Add</span>
             <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>`;
            btn.disabled = false;
            base64ImageString = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('fileNameDisplay').innerText = "Drop image for AI analysis...";
            document.getElementById('fileNameDisplay').classList.remove('text-indigo-300');
        }
    }

    async function fetchAISuggestions(text) {
        const box = document.getElementById("suggestionsBox");
        const container = document.getElementById("suggestionsBoxContainer");
        
        container.classList.remove("hidden");
        box.classList.remove("hidden");
        box.innerHTML = '<div class="text-xs text-slate-500 p-2 animate-pulse">Thinking...</div>';

        try {
            const response = await fetch(API_SUGGEST_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ partial_task: text })
            });

            const data = await response.json();
            const suggestions = data.suggestions || [];
            
            box.innerHTML = "";
            if (suggestions.length > 0) {
                suggestions.forEach(s => {
                    const div = document.createElement("div");
                    div.className = "p-3 hover:bg-slate-700/50 cursor-pointer text-sm text-slate-300 hover:text-white transition border-b border-slate-700/50 last:border-0";
                    div.textContent = s;
                    div.onclick = () => {
                        document.getElementById("taskInput").value = s;
                        container.classList.add("hidden");
                    };
                    box.appendChild(div);
                });
            } else {
                container.classList.add("hidden");
            }
        } catch (e) {
            container.classList.add("hidden");
        }
    }

    async function generateRetrospective() {
        const modal = document.getElementById('coachModal');
        modal.classList.remove('hidden');
        document.getElementById('coachSummary').innerHTML = '<span class="animate-pulse">🧠 Consulting AI Coach...</span>';
        
        try {
            const response = await fetch(API_RETRO_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ completed: completed, pending: tasks })
            });
            const data = await response.json();
            
            document.getElementById('coachSummary').innerText = data.summary;
            document.getElementById('coachScore').innerText = data.productivity_score;
            document.getElementById('coachPatterns').innerHTML = data.patterns.map(p => 
                `<li class="flex items-start gap-2 text-sm text-slate-300"><span class="text-indigo-400 mt-1">●</span>${p}</li>`
            ).join('');
            document.getElementById('coachAdvice').innerHTML = data.advice.map(a => 
                `<li class="bg-emerald-900/10 border border-emerald-500/20 p-3 rounded-lg text-sm text-emerald-100 flex items-start gap-2"><span>🚀</span>${a}</li>`
            ).join('');

        } catch (e) {
            document.getElementById('coachSummary').innerText = "Coach unavailable.";
        }
    }

    // --- HELPERS & UTILS ---

    function handleInput(val) {
        clearTimeout(suggestionTimeout);
        if(val.length > 3) {
            suggestionTimeout = setTimeout(() => fetchAISuggestions(val), 600);
        } else {
            document.getElementById("suggestionsBoxContainer").classList.add("hidden");
        }
    }

    function analyzeTaskFallback(text) {
        let task = { text, time: "unspecified", category: "General", urgent: false, note: "Local fallback", effort_score: "Low", status: "Pending" };
        if (text.match(/urgent|asap/i)) { task.urgent = true; task.effort_score = "High"; }
        if (text.match(/tomorrow/i)) task.time = "Tomorrow";
        return task;
    }

    function requestNotificationPermission() {
        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }
    }

    function scheduleReminder(task) {
        if (!task.time || task.time === 'unspecified') return;
        const target = new Date(task.time);
        const now = new Date();
        const delay = target.getTime() - now.getTime();
        
        if (delay > 0 && delay < 2147483647) {
            setTimeout(() => {
                if (Notification.permission === "granted") new Notification("Task Due: " + task.text);
            }, delay);
        }
    }

    // --- DATA PERSISTENCE ---
    function loadTasks() {
        const t = localStorage.getItem('ai_tasks');
        const c = localStorage.getItem('ai_completed');
        if(t) tasks = JSON.parse(t);
        if(c) completed = JSON.parse(c);
    }
    function saveTasks() {
        localStorage.setItem('ai_tasks', JSON.stringify(tasks));
        localStorage.setItem('ai_completed', JSON.stringify(completed));
    }

    // --- TASK ACTIONS ---
    function completeTask(index) {
        tasks[index].status = "Done";
        completed.push(tasks[index]);
        tasks.splice(index, 1);
        saveTasks();
        showList();
    }
    function deleteTask(index) {
        if(confirm("Delete this task?")) {
            tasks.splice(index, 1);
            saveTasks();
            showList();
        }
    }
    
    // --- MODAL ACTIONS ---
    function openEditModal(index) {
        const task = tasks[index];
        document.getElementById('editTaskIndex').value = index;
        document.getElementById('editText').value = task.text;
        document.getElementById('editDate').value = task.time.match(/^\d{4}-\d{2}-\d{2}/) ? task.time.substring(0, 10) : '';
        document.getElementById('editEffort').value = task.effort_score || 'Low';
        document.getElementById('editModal').classList.remove('hidden');
    }
    function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }
    function closeCoachModal() { document.getElementById('coachModal').classList.add('hidden'); }
    
    function saveEdit() {
        const idx = document.getElementById('editTaskIndex').value;
        const task = tasks[idx];
        task.text = document.getElementById('editText').value;
        const d = document.getElementById('editDate').value;
        if(d) task.time = d;
        task.effort_score = document.getElementById('editEffort').value;
        task.urgent = (task.effort_score === 'High' || task.effort_score === 'Critical');
        
        saveTasks();
        showList();
        closeEditModal();
    }
  </script>
</body>
</html>
